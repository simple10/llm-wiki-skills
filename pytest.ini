# Two trees of tests. `tests/` is the package's: the harness (every unit
# installed and enabled through the real CLI), the manifests, the docs gate,
# and what has to hold across every unit. `skills/<unit>/tests/` is the
# unit's own — its scripts against its fixtures, no CLI — and ships with it,
# so an agent in a wiki can run them from the enabled copy:
#
#   uv run --with pytest pytest <ops dir>/skills/<unit>/tests -p no:cacheprovider
#
# (`-p no:cacheprovider`: a `.pytest_cache` in an enabled copy reads as drift.)
# importlib mode, because a shipped module is found by its path, not imported
# by a name that has to be unique across the trees.
[pytest]
testpaths = tests skills
addopts = --import-mode=importlib
pythonpath = tests
