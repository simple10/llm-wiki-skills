# The package harness: every artifact installs, lists clean and enables
# through the real ops CLI, and each unit script's own tests run. Same
# checkout/uv actions and git identity step as llm-wiki-plugins' `suites`
# job; GitHub-hosted rather than that job's Avrea runner, because this repo
# is public and its Actions minutes are free.
name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref; a newer push to the same PR cancels the older one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Which llm-wiki-plugins ref the CLI comes from. `main` is what a merge here
# must be green against; a branch may point it at a plugins branch to prove
# itself against a CLI that has not landed, and sets it back before it lands.
env:
  PLUGINS_REF: main

jobs:
  harness:
    name: harness
    runs-on: ubuntu-latest
    # ~1 minute of work. The ceiling is a runaway's bill, not a target.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The install tests `init` real git repos and commit in them; a bare
      # runner has no git identity and every one of those commits would die
      # on "Please tell me who you are".
      - name: Set git identity
        run: |
          git config --global user.name "llm-wiki-ci"
          git config --global user.email "ci@users.noreply.github.com"
      # The ops CLI comes from llm-wiki-plugins, which is not public, and it
      # must run FROM that checkout: the wheel alone has no plugin tree —
      # `scripts/` and `skills/` live beside the package, and `run` serves
      # a unit's plugin-side scripts out of them. The secret is a
      # fine-grained token with Contents: read on that repo and nothing
      # else. It reaches git's URL rewrite only — never a package spec, a
      # command line, or anything uv could echo back in an error. Without
      # the secret the install tests SKIP (and say so); the script tests run
      # regardless, since a unit script is stdlib-only.
      #
      # `LLM_WIKI_OPS` is the command the harness runs (conftest); a `uv run
      # --project` against the checkout, the same shape a developer's proof
      # run uses. `LLM_WIKI_OPS_PLUGIN` is the plugin's root: the
      # youtube-note cases look under it for `format_transcript.py`, at the
      # address the unit itself runs, and FAIL if it is not there.
      - name: Check out llm-wiki-plugins and resolve the ops CLI
        env:
          LLM_WIKI_OPS_INSTALL: ${{ secrets.LLM_WIKI_OPS_INSTALL }}
        run: |
          if [ -z "$LLM_WIKI_OPS_INSTALL" ]; then
            echo "::warning::LLM_WIKI_OPS_INSTALL is unset — the install harness skips; only the script tests run"
            exit 0
          fi
          git config --global url."https://x-access-token:${LLM_WIKI_OPS_INSTALL}@github.com/".insteadOf "https://github.com/"
          plugins="$RUNNER_TEMP/llm-wiki-plugins"
          # Unpinned within the ref on purpose: the docs and the harness are
          # checked against the CLI as it IS, so a verb or flag the plugins
          # change turns this repo red the day it lands rather than the day
          # someone installs.
          git clone --quiet --depth 1 --branch "$PLUGINS_REF" https://github.com/simple10/llm-wiki-plugins "$plugins"
          project="$plugins/llm-wiki-ops/v1/plugin/packages/llm-wiki-ops-v1"
          # The machine CLI answers a version anywhere; `llm-wiki-ops` is
          # `wiki --here`, so it refuses every argv outside a wiki, `--version`
          # among them. Both are console scripts of this one project.
          uv run --project "$project" llm-wiki-cli --version
          echo "LLM_WIKI_OPS=uv run --project $project llm-wiki-ops" >> "$GITHUB_ENV"
          echo "LLM_WIKI_OPS_PLUGIN=$plugins/llm-wiki-ops/v1/plugin" >> "$GITHUB_ENV"
      # Some cases run a unit script the way production does — `uv run --script`, OFFLINE, so a
      # test can never reach a venue — and skip, saying so, when its PEP 723 dependencies are
      # not in uv's cache. A fresh runner's cache is empty: resolve them once here, online, so
      # those cases RUN in CI rather than skip. `-h` imports nothing heavy and touches no venue.
      - name: Warm the unit scripts' dependencies
        run: |
          for script in skills/*/scripts/*.py; do
            grep -q '^# /// script' "$script" || continue
            uv run --quiet --script "$script" -h > /dev/null 2>&1 || echo "::warning::could not warm $script"
          done
      # `skills enable` refuses a skill whose `requires.bins` are not on PATH
      # and installs nothing itself, so the runner supplies what the manifests
      # declare. `uv tool` puts the binary where setup-uv already put PATH.
      - name: Install the binaries the manifests declare
        run: uv tool install yt-dlp
      - name: Check the manifest
        run: python3 scripts/check-manifest.py
      # `-rs`: every skip prints its reason, so a harness that skipped its
      # install tier is visible in the log, never a quiet green.
      - name: Run the harness
        run: uv run --with pytest --python 3.12 pytest -q -rs
