name: test
on: [push, pull_request]
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The ops CLI comes from llm-wiki-plugins, which is not public. The
      # secret holds an installable spec — `git+https://<token>@github.com/
      # simple10/llm-wiki-plugins#subdirectory=llm-wiki-ops/v1/plugin/packages/llm-wiki-ops-v1`
      # or a wheel URL. Without it the install tests SKIP (and say so); the
      # script tests run regardless, since a unit script is stdlib-only.
      - name: install the ops CLI
        env:
          LLM_WIKI_OPS_INSTALL: ${{ secrets.LLM_WIKI_OPS_INSTALL }}
        run: |
          if [ -z "$LLM_WIKI_OPS_INSTALL" ]; then
            echo "::warning::LLM_WIKI_OPS_INSTALL is unset — the install harness skips; only the script tests run"
            exit 0
          fi
          uv tool install "$LLM_WIKI_OPS_INSTALL"
          llm-wiki-ops-v1 --version
      - name: check-manifest
        run: python3 scripts/check-manifest.py
      - name: tests
        run: uv run --with pytest --python 3.12 pytest -q tests
